[package]
name = "kiwi"
version = "0.1.0"
edition = "2024"
authors = ["Tribal-Chief-001 <raffrajput123@gmail.com>"]
description = "🥝 Ultra-fast, zero-footprint (<4MB RSS) cross-platform CLI network intelligence and speed test engine"
readme = "README.md"
license = "MIT"
repository = "https://github.com/Tribal-Chief-001/Kiwi"
homepage = "https://github.com/Tribal-Chief-001/Kiwi"
documentation = "https://github.com/Tribal-Chief-001/Kiwi#readme"
keywords = ["speedtest", "network", "bandwidth", "cli", "bufferbloat"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "kiwi"
path = "src/lib.rs"

[[bin]]
name = "kiwi"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.43", features = ["rt", "net", "time", "macros", "sync", "io-util", "signal"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
h2 = "0.4"
http = "1.2"
bytes = "1.10"
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Media"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
